<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>深さ優先探索 (DFS) — アルゴリズム可視化</title>
<link rel="stylesheet" href="algo-common.css">
<style>#viz-container{padding:8px;overflow:hidden;}</style>
<script src="algo-theme.js"></script>
</head>
<body>
<header>
  <a href="index.html" class="back-btn">一覧へ</a>
  <h1>深さ優先探索 (DFS)</h1>
  <span class="algo-tag">木・グラフ</span>
</header>
<main>
  <div class="panel" id="panel-viz">
    <div class="panel-header">可視化</div>
    <div id="viz-container"></div>
    <div id="info-msg"></div>
  </div>
  <div class="panel" id="panel-code">
    <div class="panel-header">コード</div>
    <div id="code-container"></div>
  </div>
  <div class="panel" id="panel-trace">
    <div class="panel-header">トレース</div>
    <div id="trace-container">
      <table id="trace-table"><thead><tr></tr></thead><tbody></tbody></table>
    </div>
  </div>
</main>
<div id="controls">
  <button class="ctrl-btn" id="btn-reset">⟳ リセット</button>
  <button class="ctrl-btn" id="btn-prev">◀ 前へ</button>
  <button class="ctrl-btn primary" id="btn-play">▶ 再生</button>
  <button class="ctrl-btn" id="btn-next">次へ ▶</button>
  <span id="step-counter">0 / 0</span>
  <div class="speed-group">
    <label>速度</label>
    <input type="range" id="speed-slider" min="1" max="10" value="1">
    <span id="speed-label">1.8x</span>
  </div>
</div>
<script>
window.ALGO_CODE = [
  'function dfs(graph, start) {',
  '  const visited = new Set();',
  '  const stack = [start];',
  '  const order = [];',
  '  while (stack.length > 0) {',
  '    const node = stack.pop(); // 末尾から取り出す',
  '    if (visited.has(node)) continue;',
  '    visited.add(node);',
  '    order.push(node);',
  '    for (const neighbor of graph[node].slice().reverse()) {',
  '      if (!visited.has(neighbor)) {',
  '        stack.push(neighbor);',
  '      }',
  '    }',
  '  }',
  '  return order;',
  '}'
];

window.TRACE_HEADERS = ['ステップ','取り出すノード','スタック','訪問済み','訪問順'];

window.generateSteps = function() {
  var steps = [], sn = 0;
  var graph = {0:[1,2], 1:[0,3,4], 2:[0,5,6], 3:[1], 4:[1], 5:[2], 6:[2]};
  var nodeStates = {0:'default',1:'default',2:'default',3:'default',4:'default',5:'default',6:'default'};
  var visited = [], stack = [], order = [];

  function hasV(n) { return visited.indexOf(n) >= 0; }
  function fmtA(a) { return '['+a.join(',')+']'; }
  function fmtV(a) { return '{'+a.join(',')+'}'; }

  function snap(cl, desc, taken) {
    sn++;
    var ns = {};
    for (var k = 0; k < 7; k++) ns[k] = nodeStates[k];
    steps.push({
      codeLine: cl,
      description: desc,
      traceRow: {
        'ステップ': sn,
        '取り出すノード': taken !== undefined ? taken : '-',
        'スタック': fmtA(stack),
        '訪問済み': fmtV(visited),
        '訪問順': fmtA(order)
      },
      vizData: {nodeStates: ns, stack: stack.slice(), order: order.slice()}
    });
  }

  snap(1, 'visited = new Set() を作成', undefined);
  stack.push(0);
  nodeStates[0] = 'inStack';
  snap(2, 'stack = [0] を初期化', undefined);
  snap(3, 'order = [] を初期化', undefined);

  while (stack.length > 0) {
    snap(4, 'stack.length > 0 → ループ継続', undefined);
    var node = stack.pop();
    nodeStates[node] = 'current';
    snap(5, 'node = stack.pop() = ' + node, node);
    if (hasV(node)) {
      snap(6, 'visited.has(' + node + ') → continue (スキップ)', node);
      nodeStates[node] = 'visited';
      continue;
    }
    snap(6, 'visited.has(' + node + ') → false (処理継続)', node);
    visited.push(node);
    snap(7, 'visited.add(' + node + ')', node);
    order.push(node);
    snap(8, 'order.push(' + node + ')', node);
    var revNbrs = graph[node].slice().reverse();
    for (var i = 0; i < revNbrs.length; i++) {
      var nb = revNbrs[i];
      snap(9, 'neighbor = ' + nb + ' を確認 (reversed)', node);
      if (!hasV(nb)) {
        snap(10, '!visited.has(' + nb + ') → true', node);
        stack.push(nb);
        nodeStates[nb] = 'inStack';
        snap(11, 'stack.push(' + nb + ') → スタック:' + fmtA(stack), node);
      } else {
        snap(10, '!visited.has(' + nb + ') → false (スキップ)', node);
      }
    }
    nodeStates[node] = 'visited';
  }
  snap(4, 'stack が空 → ループ終了', undefined);
  snap(14, 'return order = ' + fmtA(order), undefined);
  return steps;
};

window.renderViz = function(step) {
  var _C = window.getVizColors ? window.getVizColors() : {};
  var d = step.vizData;
  if (!d) return;
  var nodePos = {
    0:{x:245,y:37}, 1:{x:123,y:135}, 2:{x:368,y:135},
    3:{x:61,y:245}, 4:{x:184,y:245}, 5:{x:319,y:245}, 6:{x:441,y:245}
  };
  var edgeList = [[0,1],[0,2],[1,3],[1,4],[2,5],[2,6]];

  var svg = '<svg viewBox="0 0 515 285" style="width:100%;max-height:235px">';
  edgeList.forEach(function(e) {
    var a = nodePos[e[0]], b = nodePos[e[1]];
    svg += '<line x1="'+a.x+'" y1="'+a.y+'" x2="'+b.x+'" y2="'+b.y+'" stroke="'+(_C.edge||'#2e3250')+'" stroke-width="2"/>';
  });
  for (var n = 0; n < 7; n++) {
    var p = nodePos[n];
    var st = d.nodeStates[n] || 'default';
    var f=''+(_C.nodeFill||'#23263a')+'', sk=''+(_C.edge||'#2e3250')+'', sw='1.5';
    if      (st==='current') {f=''+(_C._cmpRgba+'0.4)')+'';  sk=''+(_C.compare||'#f5c542')+''; sw='3';}
    else if (st==='inStack') {f=''+(_C._defRgba+'0.25)')+''; sk=''+(_C.default||'#4f8ef7')+''; sw='2';}
    else if (st==='visited') {f=''+(_C._srtRgba+'0.25)')+''; sk=''+(_C.sorted||'#3ecf6a')+''; sw='2';}
    svg += '<circle cx="'+p.x+'" cy="'+p.y+'" r="25" fill="'+f+'" stroke="'+sk+'" stroke-width="'+sw+'"/>';
    svg += '<text x="'+p.x+'" y="'+(p.y+5)+'" text-anchor="middle" fill="'+(_C.nodeText||'#e2e8f0')+'" font-size="18" font-weight="600" font-family="Consolas,monospace">'+n+'</text>';
  }
  svg += '</svg>';

  var stk = d.stack;
  var sHtml = '<div style="display:flex;align-items:center;gap:4px;padding:3px 8px;flex-wrap:wrap">'
    + '<span style="font-size:1.01rem;color:'+(_C.dim||'#8892b0')+';margin-right:4px;font-family:Consolas,monospace">スタック (↑top):</span>';
  if (stk.length === 0) {
    sHtml += '<span style="font-size:1.01rem;color:'+(_C.dim||'#8892b0')+'">(空)</span>';
  } else {
    var disp = stk.slice().reverse();
    disp.forEach(function(v, idx) {
      var isTp = idx === 0;
      sHtml += '<span style="display:inline-flex;align-items:center;justify-content:center;width:30px;height:30px;'
        + 'border-radius:4px;border:1px solid '+(isTp?''+(_C.compare||'#f5c542')+'':''+(_C.default||'#4f8ef7')+'')+';background:'+(isTp?''+(_C._cmpRgba+'0.2)')+'':''+(_C._defRgba+'0.2)')+'')+';color:'+(_C.nodeText||'#e2e8f0')+';'
        + 'font-size:1.06rem;font-family:Consolas,monospace">'+v+'</span>';
    });
  }
  sHtml += '</div>';

  var oHtml = '<div style="padding:2px 8px;font-size:1.01rem;color:'+(_C.dim||'#8892b0')+';font-family:Consolas,monospace">'
    + '訪問順: ' + (d.order.length > 0 ? d.order.join(' → ') : '(なし)') + '</div>';

  document.getElementById('viz-container').innerHTML = svg + sHtml + oHtml;
};

</script>
<script src="algo-common.js"></script>
</body>
</html>

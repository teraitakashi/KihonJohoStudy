<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>二分探索木 (BST) — アルゴリズム可視化</title>
<link rel="stylesheet" href="algo-common.css">
<style>#viz-container{padding:8px;overflow:hidden;}</style>
<script src="algo-theme.js"></script>
</head>
<body>
<header>
  <a href="index.html" class="back-btn">一覧へ</a>
  <h1>二分探索木 (BST)</h1>
  <span class="algo-tag">木・グラフ</span>
</header>
<main>
  <div class="panel" id="panel-viz">
    <div class="panel-header">可視化</div>
    <div id="viz-container"></div>
    <div id="info-msg"></div>
  </div>
  <div class="panel" id="panel-code">
    <div class="panel-header">コード</div>
    <div id="code-container"></div>
  </div>
  <div class="panel" id="panel-trace">
    <div class="panel-header">トレース</div>
    <div id="trace-container">
      <table id="trace-table"><thead><tr></tr></thead><tbody></tbody></table>
    </div>
  </div>
</main>
<div id="controls">
  <button class="ctrl-btn" id="btn-reset">⟳ リセット</button>
  <button class="ctrl-btn" id="btn-prev">◀ 前へ</button>
  <button class="ctrl-btn primary" id="btn-play">▶ 再生</button>
  <button class="ctrl-btn" id="btn-next">次へ ▶</button>
  <span id="step-counter">0 / 0</span>
  <div class="speed-group">
    <label>速度</label>
    <input type="range" id="speed-slider" min="1" max="10" value="1">
    <span id="speed-label">1.8x</span>
  </div>
</div>
<script src="algo-common.js"></script>
<script>
window.ALGO_CODE = [
  'class BST {',
  '  constructor() { this.root = null; }',
  '  insert(val) {',
  '    if (!this.root) {',
  '      this.root = { val, left: null, right: null };',
  '      return;',
  '    }',
  '    let cur = this.root;',
  '    while (true) {',
  '      if (val < cur.val) {',
  '        if (!cur.left) { cur.left = { val, left: null, right: null }; break; }',
  '        cur = cur.left;',
  '      } else {',
  '        if (!cur.right) { cur.right = { val, left: null, right: null }; break; }',
  '        cur = cur.right;',
  '      }',
  '    }',
  '  }',
  '  search(val) {',
  '    let cur = this.root;',
  '    while (cur) {',
  '      if (val === cur.val) return cur;',
  '      cur = val < cur.val ? cur.left : cur.right;',
  '    }',
  '    return null;',
  '  }',
  '}'
];

window.TRACE_HEADERS = ['ステップ','操作','val','cur','cur.val','cur.left','cur.right','結果'];

window.generateSteps = function() {
  var steps = [], sn = 0;
  var pos = {
    5:{x:200,y:40}, 3:{x:100,y:110}, 7:{x:300,y:110},
    1:{x:50,y:180},  4:{x:150,y:180}, 6:{x:250,y:180}, 8:{x:350,y:180}
  };
  var treeVals = [], treeEdges = [], adj = {};

  function snap(cl, desc, op, val, cv, dir, res, pathArr, curVal, specVal, specState) {
    sn++;
    var curLeft  = (cv !== '-' && cv !== null && adj[cv] !== undefined)
      ? (adj[cv].left  !== null ? adj[cv].left  : 'null') : '-';
    var curRight = (cv !== '-' && cv !== null && adj[cv] !== undefined)
      ? (adj[cv].right !== null ? adj[cv].right : 'null') : '-';
    var ns = treeVals.map(function(v) {
      var st = 'default';
      if (pathArr && pathArr.indexOf(v) >= 0) st = 'path';
      if (v === curVal) st = 'current';
      if (v === specVal) st = specState;
      return {val:v, x:pos[v].x, y:pos[v].y, state:st};
    });
    var es = treeEdges.map(function(e) {
      return {x1:pos[e.f].x, y1:pos[e.f].y, x2:pos[e.t].x, y2:pos[e.t].y};
    });
    var curDisp = (cv !== '-' && cv !== null) ? 'Node(' + cv + ')' : '-';
    steps.push({
      codeLine: cl,
      description: desc,
      traceRow: {'ステップ':sn,'操作':op,'val':val,'cur':curDisp,'cur.val':cv,'cur.left':curLeft,'cur.right':curRight,'結果':res},
      vizData: {nodes:ns, edges:es}
    });
  }

  [5,3,7,1,4,6,8].forEach(function(val) {
    snap(2,'insert('+val+') 開始','insert',val,'-','-','-',[],null,null,null);
    if (treeVals.length === 0) {
      snap(3,'root が null → 根を作成','insert',val,'-','root','挿入',[],null,null,null);
      snap(4,'root = {val:'+val+'}','insert',val,'-','root','挿入',[],val,null,null);
      treeVals.push(val);
      adj[val] = {left:null, right:null};
    } else {
      var cur = treeVals[0];
      var path = [];
      snap(7,'cur = root ('+cur+')','insert',val,cur,'-','-',[],cur,null,null);
      while (true) {
        path.push(cur);
        snap(8,'while(true): cur = '+cur,'insert',val,cur,'-','ループ継続',path.slice(),cur,null,null);
        if (val < cur) {
          snap(9,val+' < '+cur+' → 左へ','insert',val,cur,'left','-',path.slice(),cur,null,null);
          if (!adj[cur].left) {
            snap(10,'左子が空 → ここに挿入','insert',val,cur,'left','挿入',path.slice(),cur,null,null);
            adj[cur].left = val;
            treeVals.push(val);
            adj[val] = {left:null, right:null};
            treeEdges.push({f:cur, t:val});
            snap(10,val+' 挿入完了','insert',val,cur,'left','完了',path.slice(),val,null,null);
            break;
          } else {
            var nx = adj[cur].left;
            snap(11,'cur = cur.left ('+nx+')','insert',val,nx,'left','-',path.slice(),nx,null,null);
            cur = nx;
          }
        } else {
          snap(13,val+' >= '+cur+' → 右へ','insert',val,cur,'right','-',path.slice(),cur,null,null);
          if (!adj[cur].right) {
            snap(13,'右子が空 → ここに挿入','insert',val,cur,'right','挿入',path.slice(),cur,null,null);
            adj[cur].right = val;
            treeVals.push(val);
            adj[val] = {left:null, right:null};
            treeEdges.push({f:cur, t:val});
            snap(13,val+' 挿入完了','insert',val,cur,'right','完了',path.slice(),val,null,null);
            break;
          } else {
            var nx2 = adj[cur].right;
            snap(14,'cur = cur.right ('+nx2+')','insert',val,nx2,'right','-',path.slice(),nx2,null,null);
            cur = nx2;
          }
        }
      }
    }
  });

  [{v:4},{v:9}].forEach(function(s) {
    var val = s.v;
    snap(18,'search('+val+') 開始','search',val,'-','-','-',[],null,null,null);
    var cur = treeVals[0];
    var path = [], found = false;
    snap(19,'cur = root ('+cur+')','search',val,cur,'-','-',[],cur,null,null);
    while (cur !== null && cur !== undefined) {
      path.push(cur);
      snap(20,'while(cur): cur = '+cur,'search',val,cur,'-','-',path.slice(),cur,null,null);
      if (val === cur) {
        snap(21,val+' === cur.val → 発見！','search',val,cur,'-','発見',path.slice(),null,cur,'found');
        found = true;
        break;
      } else if (val < cur) {
        var prevNodeL = cur;
        cur = adj[cur] ? adj[cur].left : null;
        var cv2L = (cur !== null && cur !== undefined) ? cur : 'null';
        snap(22,val+' < '+prevNodeL+' → cur.left へ','search',val,cv2L,'left','-',path.slice(),cur !== null && cur !== undefined ? cur : null,null,null);
      } else {
        var prevNodeR = cur;
        cur = adj[cur] ? adj[cur].right : null;
        var cv2R = (cur !== null && cur !== undefined) ? cur : 'null';
        snap(22,val+' > '+prevNodeR+' → cur.right へ','search',val,cv2R,'right','-',path.slice(),cur !== null && cur !== undefined ? cur : null,null,null);
      }
    }
    if (!found) {
      snap(24,'null → 未発見','search',val,'null','-','未発見',path.slice(),null,null,null);
    }
  });

  return steps;
};

window.renderViz = function(step) {
  var _C = window.getVizColors ? window.getVizColors() : {};
  var d = step.vizData;
  if (!d) return;
  var sc = 1.22;
  var svg = '<svg viewBox="0 0 488 256" style="width:100%;height:auto;max-height:100%">';
  (d.edges||[]).forEach(function(e) {
    svg += '<line x1="'+(e.x1*sc)+'" y1="'+(e.y1*sc)+'" x2="'+(e.x2*sc)+'" y2="'+(e.y2*sc)+'" stroke="'+(_C.edge||'#2e3250')+'" stroke-width="2"/>';
  });
  (d.nodes||[]).forEach(function(n) {
    var f=''+(_C.nodeFill||'#23263a')+'', sk=''+(_C.edge||'#2e3250')+'', sw='1.5';
    if      (n.state==='current') {f=''+(_C._cmpRgba+'0.35)')+''; sk=''+(_C.compare||'#f5c542')+''; sw='3';}
    else if (n.state==='path')    {f=''+(_C._defRgba+'0.22)')+'';  sk=''+(_C.default||'#4f8ef7')+''; sw='2';}
    else if (n.state==='found')   {f=''+(_C._srtRgba+'0.35)')+'';  sk=''+(_C.sorted||'#3ecf6a')+''; sw='3';}
    svg += '<circle cx="'+(n.x*sc)+'" cy="'+(n.y*sc)+'" r="27" fill="'+f+'" stroke="'+sk+'" stroke-width="'+sw+'"/>';
    svg += '<text x="'+(n.x*sc)+'" y="'+(n.y*sc+5)+'" text-anchor="middle" fill="'+(_C.nodeText||'#e2e8f0')+'" font-size="20" font-weight="600" font-family="Consolas,monospace">'+n.val+'</text>';
  });
  svg += '</svg>';
  document.getElementById('viz-container').innerHTML = svg;
};

</script>
</body>
</html>

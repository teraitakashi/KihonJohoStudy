<!DOCTYPE html>
<html lang="ja">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Union-Find（素集合） – アルゴリズム可視化</title>
<link rel="stylesheet" href="algo-common.css">
<script src="algo-theme.js"></script>
</head>
<body>
<header>
  <a class="back-btn" href="index.html">一覧へ</a>
  <h1>Union-Find（素集合）</h1>
  <span class="algo-tag">データ構造</span>
</header>
<main>
  <div class="panel" id="panel-viz">
    <div class="panel-header">可視化</div>
    <div id="viz-container"></div>
    <div id="info-msg"></div>
  </div>
  <div class="panel" id="panel-code">
    <div class="panel-header">コード</div>
    <div id="code-container"></div>
  </div>
  <div class="panel" id="panel-trace">
    <div class="panel-header">トレース表</div>
    <div id="trace-container">
      <table id="trace-table"><thead><tr></tr></thead><tbody></tbody></table>
    </div>
  </div>
</main>
<div id="controls">
  <button class="ctrl-btn" id="btn-reset">⟳ リセット</button>
  <button class="ctrl-btn" id="btn-prev" disabled>◀ 前へ</button>
  <button class="ctrl-btn primary" id="btn-play">▶ 再生</button>
  <button class="ctrl-btn" id="btn-next">次へ ▶</button>
  <span id="step-counter">1 / 1</span>
  <div class="speed-group">
    <label>速度</label>
    <input type="range" id="speed-slider" min="1" max="10" value="1">
    <span id="speed-label">1.0x</span>
  </div>
</div>

<script src="algo-common.js"></script>

<script>
window.ALGO_CODE = [
  'const parent = [0,1,2,3,4,5,6];',              // 0
  'const rank   = [0,0,0,0,0,0,0];',              // 1
  'function find(x) {',                            // 2
  '  let root = x;',                               // 3
  '  while (parent[root] !== root)',               // 4
  '    root = parent[root];  // 根を探す',          // 5
  '  while (parent[x] !== root) { // 経路圧縮',   // 6
  '    let next = parent[x];',                     // 7
  '    parent[x] = root;',                         // 8
  '    x = next;',                                 // 9
  '  }',                                           // 10
  '  return root;',                                // 11
  '}',                                             // 12
  'function union(x, y) {',                        // 13
  '  const rx = find(x);',                         // 14
  '  const ry = find(y);',                         // 15
  '  if (rx === ry) return;',                      // 16
  '  if (rank[rx] < rank[ry]) parent[rx] = ry;',  // 17
  '  else if (rank[rx] > rank[ry]) parent[ry] = rx;', // 18
  '  else { parent[ry] = rx; rank[rx]++; }',      // 19
  '}',                                             // 20
];

window.TRACE_HEADERS = ['ステップ', '操作', 'root', 'parent配列'];

window.generateSteps = function() {
  var steps = [], sn = 0;
  var par = [0,1,2,3,4,5,6];
  var rnk = [0,0,0,0,0,0,0];

  function snap(line, desc, hl) {
    steps.push({
      codeLine: line,
      description: desc,
      vizData: { parent: par.slice(), rank: rnk.slice(), highlightNodes: hl || [] },
      traceRow: { 'ステップ': ++sn, '操作': desc, 'root': '-', 'parent配列': '['+par.join(',')+']' }
    });
  }

  function snapR(line, desc, hl, root) {
    steps.push({
      codeLine: line,
      description: desc,
      vizData: { parent: par.slice(), rank: rnk.slice(), highlightNodes: hl || [] },
      traceRow: { 'ステップ': ++sn, '操作': desc, 'root': root, 'parent配列': '['+par.join(',')+']' }
    });
  }

  // Returns root; traces codeLines 2–11 strictly forward (never backwards)
  function doFind(x) {
    snap(2, 'find('+x+') 開始', [x]);
    var root = x;
    snap(3, 'root = '+x, [x]);

    // Phase 1: find root
    snap(4, 'while parent['+root+']='+par[root]+(par[root]!==root?' ≠ '+root+' → true':' = '+root+' → false（根）'), [root]);
    while (par[root] !== root) {
      var prev = root;
      root = par[root];
      snap(5, 'root = parent['+prev+'] = '+root, [root]);
      snap(4, 'while parent['+root+']='+par[root]+(par[root]!==root?' ≠ '+root+' → true':' = '+root+' → false（根）'), [root]);
    }

    // Phase 2: path compression
    snap(6, 'while parent['+x+']='+par[x]+(par[x]!==root?' ≠ root('+root+') → true（圧縮あり）':' = root('+root+') → false（圧縮なし）'), [x]);
    while (par[x] !== root) {
      var next = par[x];
      snap(7, 'next = parent['+x+'] = '+next, [x, next]);
      par[x] = root;
      snap(8, 'parent['+x+'] = root = '+root+' （圧縮）', [x, root]);
      x = next;
      snap(9, 'x = next = '+x, [x]);
      snap(6, 'while parent['+x+']='+par[x]+(par[x]!==root?' ≠ root('+root+') → true':' = root('+root+') → false'), [x]);
    }

    snapR(11, 'return root = '+root, [root], root);
    return root;
  }

  function doUnion(x, y) {
    snap(13, 'union('+x+','+y+') 開始', [x,y]);
    snap(14, 'find('+x+') を呼び出す', [x]);
    var rx = doFind(x);
    snap(15, 'rx='+rx+'。find('+y+') を呼び出す', [y]);
    var ry = doFind(y);
    snap(16, 'rx='+rx+', ry='+ry+(rx===ry?' → 同じ根（スキップ）':' → 異なる根（合併）'), [rx,ry]);
    if (rx === ry) return;
    if (rnk[rx] < rnk[ry]) {
      snap(17, 'rank['+rx+']='+rnk[rx]+' < rank['+ry+']='+rnk[ry]+' → parent['+rx+']='+ry, [rx,ry]);
      par[rx] = ry;
    } else if (rnk[rx] > rnk[ry]) {
      snap(18, 'rank['+rx+']='+rnk[rx]+' > rank['+ry+']='+rnk[ry]+' → parent['+ry+']='+rx, [rx,ry]);
      par[ry] = rx;
    } else {
      snap(19, 'rank等しい → parent['+ry+']='+rx+', rank['+rx+']++', [rx,ry]);
      par[ry] = rx;
      rnk[rx]++;
    }
  }

  snap(0, '初期化: parent=[0,1,2,3,4,5,6]', []);
  snap(1, '初期化: rank=[0,0,0,0,0,0,0]', []);
  doUnion(0,1);
  doUnion(2,3);
  doUnion(4,5);
  doUnion(1,4);
  doUnion(2,6);
  doFind(0);   // 深さ0：圧縮なし
  doFind(5);   // 深さ2 (5→4→0)：経路圧縮が発動

  return steps;
};

window.renderViz = function(s) {
  var _C = window.getVizColors ? window.getVizColors() : {};
  var d = s.vizData;
  var container = document.getElementById('viz-container');
  container.innerHTML = '';

  var NS = 'http://www.w3.org/2000/svg';
  var W = 580, H = 280;
  var svg = document.createElementNS(NS, 'svg');
  svg.setAttribute('viewBox', '0 0 ' + W + ' ' + H);
  svg.style.width = '100%';
  svg.style.maxWidth = W + 'px';
  svg.style.height = 'auto';

  function el(tag, attrs, txt) {
    var e = document.createElementNS(NS, tag);
    Object.keys(attrs).forEach(function(k) { e.setAttribute(k, attrs[k]); });
    if (txt !== undefined) e.textContent = txt;
    return e;
  }

  var vc = window.getVizColors ? window.getVizColors() : null;
  var COMP_COLORS = vc ? vc.comp : [''+(_C.default||'#4f8ef7')+'', ''+(_C.sorted||'#3ecf6a')+'', ''+(_C.swap||'#e05c5c')+'', ''+(_C.key||'#c084fc')+'', ''+(_C.min||'#f08c3a')+''];
  var N = 7, R = 22, nodeY = 168;
  var spacing = 75;
  var startX = (W - (N - 1) * spacing) / 2; // 65

  function nx(i) { return startX + i * spacing; }

  // Compute real root of each node (iterate, no mutation)
  function trueRoot(i) {
    var cur = i;
    while (d.parent[cur] !== cur) cur = d.parent[cur];
    return cur;
  }

  var nodeRoot = [];
  var compRoots = [];
  for (var i = 0; i < N; i++) {
    var r = trueRoot(i);
    nodeRoot[i] = r;
    if (compRoots.indexOf(r) < 0) compRoots.push(r);
  }
  compRoots.sort(function(a, b) { return a - b; });

  function compColorIdx(i) { return compRoots.indexOf(nodeRoot[i]) % COMP_COLORS.length; }
  function compColor(i) { return COMP_COLORS[compColorIdx(i)]; }

  // Arrow markers – one per component color
  var defs = document.createElementNS(NS, 'defs');
  COMP_COLORS.forEach(function(color, ci) {
    var marker = document.createElementNS(NS, 'marker');
    marker.setAttribute('id', 'arw' + ci);
    marker.setAttribute('markerWidth', '8'); marker.setAttribute('markerHeight', '8');
    marker.setAttribute('refX', '7'); marker.setAttribute('refY', '3');
    marker.setAttribute('orient', 'auto');
    var mp = document.createElementNS(NS, 'path');
    mp.setAttribute('d', 'M0,0 L0,6 L7,3 z');
    mp.setAttribute('fill', color);
    marker.appendChild(mp); defs.appendChild(marker);
  });
  svg.appendChild(defs);

  // Operation label at top
  var opLabel = d.operation;
  if (d.x !== null) opLabel += '(' + d.x + (d.y !== null ? ', ' + d.y : '') + ')';
  svg.appendChild(el('text', {
    x: W / 2, y: 15, 'text-anchor': 'middle',
    fill: (getComputedStyle(document.documentElement).getPropertyValue('--dim').trim() || '#9c6b72'), 'font-size': '14', 'font-family': 'Segoe UI,sans-serif'
  }, opLabel));

  // Draw arrows: child → parent as a curved arc above the node row
  for (var i = 0; i < N; i++) {
    if (d.parent[i] === i) continue; // root – no arrow
    var pi = d.parent[i];
    var x1 = nx(i), x2 = nx(pi);
    var y1 = nodeY - R, y2 = nodeY - R;
    var mx = (x1 + x2) / 2;
    var dist = Math.abs(x2 - x1);
    var arcH = Math.min(Math.max(32, dist * 0.38), 118);
    var cpY = nodeY - R - arcH;
    var ci = compColorIdx(i);
    var color = COMP_COLORS[ci];
    svg.appendChild(el('path', {
      d: 'M' + x1 + ',' + y1 + ' Q' + mx + ',' + cpY + ' ' + x2 + ',' + y2,
      fill: 'none', stroke: color, 'stroke-width': '2',
      'marker-end': 'url(#arw' + ci + ')'
    }));
  }

  // Draw nodes
  for (var i = 0; i < N; i++) {
    var cx = nx(i), cy = nodeY;
    var isHL = d.highlightNodes && d.highlightNodes.indexOf(i) >= 0;
    var isRoot = d.parent[i] === i;
    var baseColor = compColor(i);
    var strokeColor = isHL ? (window.getVizColors ? window.getVizColors()['compare'] : ''+(_C.compare||'#f5c542')+'') : baseColor;
    var fillColor = isHL ? ''+(_C._defRgba+'0.18)')+'' : (baseColor + '22');
    var textColor = isHL ? (window.getVizColors ? window.getVizColors()['compare'] : ''+(_C.compare||'#f5c542')+'') : (window.getVizColors ? window.getVizColors()['text'] : ''+(_C.nodeText||'#e2e8f0')+'');

    // Dashed ring for roots
    if (isRoot) {
      svg.appendChild(el('circle', {
        cx: cx, cy: cy, r: R + 5,
        fill: 'none', stroke: strokeColor, 'stroke-width': '1.5',
        'stroke-dasharray': '4,3', opacity: '0.55'
      }));
    }

    svg.appendChild(el('circle', {
      cx: cx, cy: cy, r: R, fill: fillColor,
      stroke: strokeColor, 'stroke-width': '2.5'
    }));
    svg.appendChild(el('text', {
      x: cx, y: cy, 'text-anchor': 'middle', 'dominant-baseline': 'middle',
      fill: textColor, 'font-size': '19', 'font-weight': '700',
      'font-family': 'Consolas,monospace'
    }, String(i)));

    // Small parent-index label below each node
    svg.appendChild(el('text', {
      x: cx, y: nodeY + R + 14, 'text-anchor': 'middle',
      fill: '#4a5070', 'font-size': '11', 'font-family': 'Consolas,monospace'
    }, 'p[' + i + ']=' + d.parent[i]));
  }

  // parent[] and rank[] arrays at bottom
  svg.appendChild(el('text', {
    x: W / 2, y: nodeY + R + 38, 'text-anchor': 'middle',
    fill: (getComputedStyle(document.documentElement).getPropertyValue('--dim').trim() || '#9c6b72'), 'font-size': '12.5', 'font-family': 'Consolas,monospace'
  }, 'parent = [' + d.parent.join(', ') + ']'));
  svg.appendChild(el('text', {
    x: W / 2, y: nodeY + R + 56, 'text-anchor': 'middle',
    fill: (getComputedStyle(document.documentElement).getPropertyValue('--dim').trim() || '#9c6b72'), 'font-size': '12.5', 'font-family': 'Consolas,monospace'
  }, 'rank   = [' + d.rank.join(', ') + ']'));

  container.appendChild(svg);
};
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>バブルソート - アルゴリズム可視化</title>
<link rel="stylesheet" href="algo-common.css">
<script src="algo-theme.js"></script>
</head>
<body>
<header>
  <a href="index.html" class="back-btn">一覧へ</a>
  <h1>バブルソート</h1>
  <span class="algo-tag">整列</span>
</header>
<main>
  <div class="panel" id="panel-viz">
    <div class="panel-header">可視化</div>
    <div id="viz-container"></div>
    <div id="info-msg"></div>
  </div>
  <div class="panel" id="panel-code">
    <div class="panel-header">コード</div>
    <div id="code-container"></div>
  </div>
  <div class="panel" id="panel-trace">
    <div class="panel-header">トレース表</div>
    <div id="trace-container">
      <table id="trace-table"><thead><tr></tr></thead><tbody></tbody></table>
    </div>
  </div>
</main>
<div id="controls">
  <button class="ctrl-btn" id="btn-reset">↺ リセット</button>
  <button class="ctrl-btn" id="btn-prev" disabled>◀ 前へ</button>
  <button class="ctrl-btn primary" id="btn-play">▶ 再生</button>
  <button class="ctrl-btn" id="btn-next">次へ ▶</button>
  <span id="step-counter">0 / 0</span>
  <div class="speed-group">
    <label>速度</label>
    <input type="range" id="speed-slider" min="1" max="10" value="1">
    <span id="speed-label">1.0x</span>
  </div>
</div>
<script src="algo-common.js"></script>
<script>
window.ALGO_CODE = [
  'function bubbleSort(arr) {',
  '  const n = arr.length;',
  '  for (let i = 0; i < n - 1; i++) {',
  '    for (let j = 0; j < n - 1 - i; j++) {',
  '      if (arr[j] > arr[j + 1]) {',
  '        // 交換',
  '        const tmp = arr[j]; arr[j] = arr[j+1]; arr[j+1] = tmp;',
  '      }',
  '    }',
  '    // arr[n-1-i] が確定',
  '  }',
  '  return arr;',
  '}'
];

window.TRACE_HEADERS = ['ステップ', 'i', 'j', 'arr[j]', 'arr[j+1]', '交換', '配列'];

window.renderViz = function(step) {
  var _C = window.getVizColors ? window.getVizColors() : {};
  var d = step.vizData;
  var arr = d.arr, states = d.states;
  var maxVal = Math.max.apply(null, arr);
  var colorMap = window.getVizColors ? window.getVizColors() : {
    'default': '#4f8ef7', 'compare': '#f5c542', 'swap': '#e05c5c',
    'sorted': '#3ecf6a', 'min': '#f08c3a', 'shift': '#f08c3a',
    'key': '#7c5cbf', 'current': '#7c5cbf'
  };
  var bars = arr.map(function(val, idx) {
    var h = Math.max(4, Math.round(val / maxVal * 185));
    var bg = colorMap[states[idx]] || ''+(_C.default||'#4f8ef7')+'';
    var pts = [];
    if (d.i >= 0 && idx === d.i) pts.push('i');
    if (d.j >= 0 && idx === d.j) pts.push('j');
    if (d.j >= 0 && idx === d.j + 1) pts.push('j+1');
    var pl = pts.length
      ? '<div style="position:absolute;top:-18px;left:50%;transform:translateX(-50%);font-size:.90rem;color:'+(_C.compare||'#f5c542')+';font-family:monospace;white-space:nowrap">' + pts.join('/') + '</div>'
      : '';
    return '<div style="display:flex;flex-direction:column;align-items:center;justify-content:flex-end;flex:1;max-width:72px;position:relative">' +
      pl +
      '<div style="width:100%;height:' + h + 'px;background:' + bg + ';border-radius:3px 3px 0 0;transition:height .15s,background .15s"></div>' +
      '<div style="font-size:.90rem;color:'+(_C.dim||'#8892b0')+';font-family:monospace;margin-top:3px">' + val + '</div>' +
      '</div>';
  }).join('');
  document.getElementById('viz-container').innerHTML =
    '<div style="display:flex;align-items:flex-end;gap:4px;height:220px;padding:0 8px 24px;width:100%;justify-content:center">' + bars + '</div>';
};

window.generateSteps = function() {
  var arr = [64, 34, 25, 12, 22, 11, 90];
  var n = arr.length;
  var steps = [];
  var stepNum = 0;
  var sorted = new Array(n).fill(false);

  function mkStates(compareJ, swapPair) {
    return arr.map(function(_, idx) {
      if (sorted[idx]) return 'sorted';
      if (swapPair && (idx === swapPair[0] || idx === swapPair[1])) return 'swap';
      if (compareJ != null && (idx === compareJ || idx === compareJ + 1)) return 'compare';
      return 'default';
    });
  }

  steps.push({
    codeLine: 0,
    description: 'バブルソート開始',
    vizData: { arr: arr.slice(), states: mkStates(), i: -1, j: -1 },
    traceRow: { 'ステップ': ++stepNum, i: '-', j: '-', 'arr[j]': '-', 'arr[j+1]': '-', '交換': '-', '配列': arr.join(',') }
  });

  for (var i = 0; i < n - 1; i++) {
    steps.push({
      codeLine: 2,
      description: 'i = ' + i + ' の外側ループ開始',
      vizData: { arr: arr.slice(), states: mkStates(), i: i, j: -1 },
      traceRow: { 'ステップ': ++stepNum, i: i, j: '-', 'arr[j]': '-', 'arr[j+1]': '-', '交換': '-', '配列': arr.join(',') }
    });
    for (var j = 0; j < n - 1 - i; j++) {
      steps.push({
        codeLine: 3,
        description: 'j=' + j + ': 内側ループ (j < ' + (n-1-i) + ')',
        vizData: { arr: arr.slice(), states: mkStates(j), i: i, j: j },
        traceRow: { 'ステップ': ++stepNum, i: i, j: j, 'arr[j]': arr[j], 'arr[j+1]': arr[j+1], '交換': '-', '配列': arr.join(',') }
      });
      var willSwap = arr[j] > arr[j + 1];
      steps.push({
        codeLine: 4,
        description: 'arr[' + j + ']=' + arr[j] + ' と arr[' + (j+1) + ']=' + arr[j+1] + ' を比較',
        vizData: { arr: arr.slice(), states: mkStates(j), i: i, j: j },
        traceRow: { 'ステップ': ++stepNum, i: i, j: j, 'arr[j]': arr[j], 'arr[j+1]': arr[j+1], '交換': willSwap ? 'はい' : 'いいえ', '配列': arr.join(',') }
      });
      if (willSwap) {
        var tmp = arr[j]; arr[j] = arr[j+1]; arr[j+1] = tmp;
        steps.push({
          codeLine: 6,
          description: 'arr[' + j + '] と arr[' + (j+1) + '] を交換 → [' + arr.join(',') + ']',
          vizData: { arr: arr.slice(), states: mkStates(null, [j, j+1]), i: i, j: j },
          traceRow: { 'ステップ': ++stepNum, i: i, j: j, 'arr[j]': arr[j], 'arr[j+1]': arr[j+1], '交換': 'はい', '配列': arr.join(',') }
        });
      }
    }
    sorted[n - 1 - i] = true;
    steps.push({
      codeLine: 9,
      description: 'arr[' + (n-1-i) + ']=' + arr[n-1-i] + ' が確定位置に',
      vizData: { arr: arr.slice(), states: mkStates(), i: i, j: -1 },
      traceRow: { 'ステップ': ++stepNum, i: i, j: '-', 'arr[j]': '-', 'arr[j+1]': '-', '交換': '-', '配列': arr.join(',') }
    });
  }

  sorted[0] = true;
  steps.push({
    codeLine: 11,
    description: 'ソート完了！',
    vizData: { arr: arr.slice(), states: new Array(n).fill('sorted'), i: -1, j: -1 },
    traceRow: { 'ステップ': ++stepNum, i: '-', j: '-', 'arr[j]': '-', 'arr[j+1]': '-', '交換': '-', '配列': arr.join(',') }
  });

  return steps;
};
</script>
</body>
</html>

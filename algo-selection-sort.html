<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>選択ソート - アルゴリズム可視化</title>
<link rel="stylesheet" href="algo-common.css">
<script src="algo-theme.js"></script>
</head>
<body>
<header>
  <a href="index.html" class="back-btn">一覧へ</a>
  <h1>選択ソート</h1>
  <span class="algo-tag">整列</span>
</header>
<main>
  <div class="panel" id="panel-viz">
    <div class="panel-header">可視化</div>
    <div id="viz-container"></div>
    <div id="info-msg"></div>
  </div>
  <div class="panel" id="panel-code">
    <div class="panel-header">コード</div>
    <div id="code-container"></div>
  </div>
  <div class="panel" id="panel-trace">
    <div class="panel-header">トレース表</div>
    <div id="trace-container">
      <table id="trace-table"><thead><tr></tr></thead><tbody></tbody></table>
    </div>
  </div>
</main>
<div id="controls">
  <button class="ctrl-btn" id="btn-reset">↺ リセット</button>
  <button class="ctrl-btn" id="btn-prev" disabled>◀ 前へ</button>
  <button class="ctrl-btn primary" id="btn-play">▶ 再生</button>
  <button class="ctrl-btn" id="btn-next">次へ ▶</button>
  <span id="step-counter">0 / 0</span>
  <div class="speed-group">
    <label>速度</label>
    <input type="range" id="speed-slider" min="1" max="10" value="1">
    <span id="speed-label">1.0x</span>
  </div>
</div>
<script src="algo-common.js"></script>
<script>
window.ALGO_CODE = [
  'function selectionSort(arr) {',
  '  const n = arr.length;',
  '  for (let i = 0; i < n - 1; i++) {',
  '    let minIdx = i;',
  '    for (let j = i + 1; j < n; j++) {',
  '      if (arr[j] < arr[minIdx]) {',
  '        minIdx = j;',
  '      }',
  '    }',
  '    if (minIdx !== i) {',
  '      const tmp = arr[i]; arr[i] = arr[minIdx]; arr[minIdx] = tmp;',
  '    }',
  '  }',
  '  return arr;',
  '}'
];

window.TRACE_HEADERS = ['ステップ', 'i', 'j', 'minIdx', 'arr[minIdx]', '操作', '配列'];

window.renderViz = function(step) {
  var _C = window.getVizColors ? window.getVizColors() : {};
  var d = step.vizData;
  var arr = d.arr, states = d.states;
  var maxVal = Math.max.apply(null, arr);
  var colorMap = window.getVizColors ? window.getVizColors() : {
    'default': '#4f8ef7', 'compare': '#f5c542', 'swap': '#e05c5c',
    'sorted': '#3ecf6a', 'min': '#f08c3a', 'shift': '#f08c3a',
    'key': '#7c5cbf', 'current': '#7c5cbf'
  };
  var bars = arr.map(function(val, idx) {
    var h = Math.max(4, Math.round(val / maxVal * 185));
    var bg = colorMap[states[idx]] || ''+(_C.default||'#4f8ef7')+'';
    var pts = [];
    if (d.i >= 0 && idx === d.i) pts.push('i');
    if (d.j >= 0 && idx === d.j) pts.push('j');
    if (d.minIdx >= 0 && idx === d.minIdx && !(d.i >= 0 && idx === d.i && d.j < 0)) pts.push('min');
    var pl = pts.length
      ? '<div style="position:absolute;top:-18px;left:50%;transform:translateX(-50%);font-size:.90rem;color:'+(_C.compare||'#f5c542')+';font-family:monospace;white-space:nowrap">' + pts.join('/') + '</div>'
      : '';
    return '<div style="display:flex;flex-direction:column;align-items:center;justify-content:flex-end;flex:1;max-width:72px;position:relative">' +
      pl +
      '<div style="width:100%;height:' + h + 'px;background:' + bg + ';border-radius:3px 3px 0 0;transition:height .15s,background .15s"></div>' +
      '<div style="font-size:.90rem;color:'+(_C.dim||'#8892b0')+';font-family:monospace;margin-top:3px">' + val + '</div>' +
      '</div>';
  }).join('');
  document.getElementById('viz-container').innerHTML =
    '<div style="display:flex;align-items:flex-end;gap:4px;height:220px;padding:0 8px 24px;width:100%;justify-content:center">' + bars + '</div>';
};

window.generateSteps = function() {
  var arr = [64, 25, 12, 22, 11, 90, 45];
  var n = arr.length;
  var steps = [];
  var stepNum = 0;

  function mkStates(sortedUpTo, minIdxV, compareIdxV, swapPair) {
    return arr.map(function(_, idx) {
      if (sortedUpTo >= 0 && idx <= sortedUpTo) return 'sorted';
      if (swapPair && (idx === swapPair[0] || idx === swapPair[1])) return 'swap';
      if (minIdxV >= 0 && idx === minIdxV) return 'min';
      if (compareIdxV >= 0 && idx === compareIdxV) return 'compare';
      return 'default';
    });
  }

  steps.push({
    codeLine: 0,
    description: '選択ソート開始',
    vizData: { arr: arr.slice(), states: mkStates(-1, -1, -1, null), i: -1, j: -1, minIdx: -1 },
    traceRow: { 'ステップ': ++stepNum, i: '-', j: '-', minIdx: '-', 'arr[minIdx]': '-', '操作': '開始', '配列': arr.join(',') }
  });

  for (var i = 0; i < n - 1; i++) {
    var minIdx = i;
    steps.push({
      codeLine: 2,
      description: 'i=' + i + ': 外側ループ (i < ' + (n-1) + ')',
      vizData: { arr: arr.slice(), states: mkStates(i - 1, -1, -1, null), i: i, j: -1, minIdx: -1 },
      traceRow: { 'ステップ': ++stepNum, i: i, j: '-', minIdx: '-', 'arr[minIdx]': '-', '操作': '外側ループ', '配列': arr.join(',') }
    });
    steps.push({
      codeLine: 3,
      description: 'i=' + i + ': minIdx = ' + i + ', arr[minIdx]=' + arr[minIdx],
      vizData: { arr: arr.slice(), states: mkStates(i - 1, minIdx, -1, null), i: i, j: -1, minIdx: minIdx },
      traceRow: { 'ステップ': ++stepNum, i: i, j: '-', minIdx: minIdx, 'arr[minIdx]': arr[minIdx], '操作': 'minIdx設定', '配列': arr.join(',') }
    });

    for (var j = i + 1; j < n; j++) {
      steps.push({
        codeLine: 4,
        description: 'j=' + j + ': 内側ループ (j < ' + n + ')',
        vizData: { arr: arr.slice(), states: mkStates(i - 1, minIdx, j, null), i: i, j: j, minIdx: minIdx },
        traceRow: { 'ステップ': ++stepNum, i: i, j: j, minIdx: minIdx, 'arr[minIdx]': arr[minIdx], '操作': '内側ループ', '配列': arr.join(',') }
      });
      var isNewMin = arr[j] < arr[minIdx];
      steps.push({
        codeLine: 5,
        description: 'arr[' + j + ']=' + arr[j] + (isNewMin ? ' < ' : ' \u2265 ') + 'arr[' + minIdx + ']=' + arr[minIdx],
        vizData: { arr: arr.slice(), states: mkStates(i - 1, minIdx, j, null), i: i, j: j, minIdx: minIdx },
        traceRow: { 'ステップ': ++stepNum, i: i, j: j, minIdx: minIdx, 'arr[minIdx]': arr[minIdx], '操作': '比較', '配列': arr.join(',') }
      });
      if (isNewMin) {
        minIdx = j;
        steps.push({
          codeLine: 6,
          description: 'minIdx = ' + j + ' に更新 (arr[' + j + ']=' + arr[j] + ' が最小)',
          vizData: { arr: arr.slice(), states: mkStates(i - 1, minIdx, -1, null), i: i, j: j, minIdx: minIdx },
          traceRow: { 'ステップ': ++stepNum, i: i, j: j, minIdx: minIdx, 'arr[minIdx]': arr[minIdx], '操作': 'minIdx更新', '配列': arr.join(',') }
        });
      }
    }

    if (minIdx !== i) {
      var preSwapDesc = 'arr[' + i + ']=' + arr[i] + ' と arr[' + minIdx + ']=' + arr[minIdx] + ' を交換';
      var tmp = arr[i]; arr[i] = arr[minIdx]; arr[minIdx] = tmp;
      steps.push({
        codeLine: 10,
        description: preSwapDesc,
        vizData: { arr: arr.slice(), states: mkStates(i - 1, -1, -1, [i, minIdx]), i: i, j: -1, minIdx: minIdx },
        traceRow: { 'ステップ': ++stepNum, i: i, j: '-', minIdx: minIdx, 'arr[minIdx]': arr[minIdx], '操作': '交換', '配列': arr.join(',') }
      });
    }

    steps.push({
      codeLine: 12,
      description: 'arr[' + i + ']=' + arr[i] + ' が確定',
      vizData: { arr: arr.slice(), states: mkStates(i, -1, -1, null), i: i, j: -1, minIdx: -1 },
      traceRow: { 'ステップ': ++stepNum, i: i, j: '-', minIdx: '-', 'arr[minIdx]': arr[i], '操作': '確定', '配列': arr.join(',') }
    });
  }

  steps.push({
    codeLine: 13,
    description: 'ソート完了！',
    vizData: { arr: arr.slice(), states: new Array(n).fill('sorted'), i: -1, j: -1, minIdx: -1 },
    traceRow: { 'ステップ': ++stepNum, i: '-', j: '-', minIdx: '-', 'arr[minIdx]': '-', '操作': '完了', '配列': arr.join(',') }
  });

  return steps;
};
</script>
</body>
</html>
